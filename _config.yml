title: TwoDog's Blog
subtitle: ''
description: ''
keywords: null
author: TwoDog
language: zh-CN
timezone: Asia/Shanghai
url: https://ergoublog.pages.dev
permalink: ':year/:month/:day/:title/'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: null
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: firefly
theme_config:
  nav:
    title: TwoDog's Blog
    logo:
      alt: TwoDog
  profile:
    name: TwoDog
    bio: 努力成为Agent Engineer的🐶
    avatar: /img/avatar.jpg
  home_text:
    title: Welcome to TwoDog's Blog！
    subtitle: Travel a thousand times, a thousand times, and enjoy the world of happiness~
  music:
    meting:
      type: song
      id: '2717588324'
  widgets:
    - type: profile
      enable: true
      position: left
    - type: announcement
      enable: true
      position: left
    - type: music
      enable: true
      position: left
    - type: categories
      enable: true
      position: left
    - type: tags
      enable: false
      position: left
    - type: dynamic
      enable: false
      position: right
    - type: stats
      enable: true
      position: right
    - type: calendar
      enable: true
      position: right
    - type: site-info
      enable: false
      position: right
  footer:
    visitor_counter: false
  analytics:
    busuanzi: false
  sidebar:
    mobile_bottom_components:
      - type: profile
        enable: true
        position: top
        show_on_post: true
      - type: music
        enable: true
        position: top
        show_on_post: true
      - type: dynamic
        enable: true
        position: top
        show_on_post: true
      - type: stats
        enable: true
        position: top
        show_on_post: true
      - type: tags
        enable: true
        position: top
        show_on_post: true
        collapse_threshold: 10
      - type: site-info
        enable: false
        position: top
        show_on_post: true
  logo:
    icon: 🐶
  wallpaper:
    src:
      - desktop: /img/wallpaper.jpg
        mobile: /img/wallpaper.jpg
  pages:
    friends:
      enable: false
    dynamic: false
    tags: false
  social:
    - name: GitHub
      icon: github
      url: https://github.com/liusitong621
    - name: Email
      icon: mail
      url: mailto:1446514792@qq.com
deploy:
  type: git
  repo: https://github.com/.git
  branch: main
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'
